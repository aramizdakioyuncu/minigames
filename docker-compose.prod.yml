# Linux Canlı Sunucu (VPS / Bare-Metal / Coolify) Üretim Yapılandırması
# Maksimum Ağ Performansı, 0-Overhead ve Saliselik WebSocket İletişimi

services:
  # 1. Signalling & REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    environment:
      - PORT=${BACKEND_PORT:-4000}

  # 2. Real-Time Game Physics & WebSocket Engine (Bare-Metal Fiziksel Ağ Kartı)
  socket:
    build:
      context: ./socket
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    environment:
      - PORT=${SOCKET_PORT:-5050}
    volumes:
      - socket_data:/app/data

  # 3. Web Client (Nginx)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    depends_on:
      - backend
      - socket

volumes:
  socket_data:
