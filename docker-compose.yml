services:
  # 1. Signalling & REST API Backend (Dahili Servis)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=${BACKEND_PORT:-4000}
    expose:
      - "${BACKEND_PORT:-4000}"
    networks:
      - ball_net

  # 2. Real-Time Game Physics & WebSocket Engine (Dahili Servis)
  socket:
    build:
      context: ./socket
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=${SOCKET_PORT:-5050}
    volumes:
      - socket_data:/app/data
    expose:
      - "${SOCKET_PORT:-5050}"
    networks:
      - ball_net

  # 3. Web Client & Reverse Proxy (Coolify Traefik Giriş Noktası)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    expose:
      - "80"
    depends_on:
      - backend
      - socket
    networks:
      - ball_net

networks:
  ball_net:
    driver: bridge

volumes:
  socket_data:

