server {
    listen 80;
    server_name localhost;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ~ /\. { deny all; }

    # Docker Embedded DNS Resolver (Prevents Nginx startup crash if backend/socket is starting)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Web Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
    }

    location = /verify-email {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        access_log off;
        expires -1;
    }

    # Authentication service: secrets and SDK remain on the server.
    location /api/auth/ {
        set $auth_upstream "http://minigames_backend:4100";
        proxy_pass $auth_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
        # Avoid writing verification/refresh tokens from accidental query strings to logs.
        access_log off;
    }

    # 2. Proxy Backend REST API (Internal Docker Network)
    location /api/ {
        set $backend_upstream "http://backend:4000";
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy WebSocket Game Server (Internal Docker Network)
    location = /ws {
        set $socket_upstream "http://socket:5050";
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeout settings for uninterrupted gaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
