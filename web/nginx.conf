server {
    listen 80;
    server_name localhost;

    # Docker Embedded DNS Resolver (Prevents Nginx startup crash if backend/socket is starting)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Web Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 2. Proxy Backend REST API (Internal Docker Network)
    location /api/ {
        set $backend_upstream "http://backend:4000";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy WebSocket Game Server (Internal Docker Network)
    location /ws {
        set $socket_upstream "http://socket:5050";
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeout settings for uninterrupted gaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
